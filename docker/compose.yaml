name: clacks

networks:
  clacks-base-network:

volumes:
  clacks-server-volume:

services:
  clacks-server:
    image: ghcr.io/rodneyosodo/clacks:latest
    container_name: clacks-server
    restart: on-failure
    networks:
      - clacks-base-network
    volumes:
      - clacks-server-volume:/data
      - ../docker/config:/config:ro
    ports:
      - ${CLACKS_SERVER_PORT:-8080}:8080
    environment:
      CLACKS_LOG_LEVEL: ${CLACKS_LOG_LEVEL:-info}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  clacks-client:
    image: ghcr.io/rodneyosodo/clacks:latest
    container_name: clacks-client
    profiles: ["client"]
    restart: on-failure
    user: "${CLACKS_UID:-1000}:${CLACKS_GID:-1000}"
    networks:
      - clacks-base-network
    depends_on:
      clacks-server:
        condition: service_started
    command: ["daemon"]
    volumes:
      - ${CLACKS_CLIENT_HOME:-../.clacks-data}:/data
      - ../docker/config:/config
      - ${OPENCODE_DB:-$HOME/.local/share/opencode/opencode.db}:/opencode/opencode.db
    environment:
      CLACKS_LOG_LEVEL: ${CLACKS_LOG_LEVEL:-info}
      CLACKS_HOME: /data
      CLACKS_CONFIG_HOME: /config
      OPENCODE_DB: /opencode/opencode.db
      CLACKS_KEY: ${CLACKS_KEY:-}
